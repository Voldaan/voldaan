    body {

      min-height: 100vh;

    #confetti-canvas {

    }

    .container { width: 100%; max-width: 580px; display: flex; flex-direction: column; gap: 18px; padding-bottom: 40px; }
    header { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; margin-bottom: 2px; }
    header h1 { font-size: 1.8rem; font-weight: 700; color: var(--accent-primary); letter-spacing: -0.5px; }
    header p { font-size: 0.85rem; color: var(--text-muted); margin-top: 2px; }

    .nav-tabs {
      display: flex; background: var(--card-bg); padding: 6px; border-radius: 14px;
      border: 1.5px solid var(--input-border); box-shadow: var(--shadow); gap: 4px; margin-bottom: 6px; overflow-x: auto;
    }

    .tab-btn {
      flex: 1; padding: 10px 6px; border: none; background: none; color: var(--text-muted);
      font-weight: 600; font-size: 0.8rem; border-radius: 10px; cursor: pointer; transition: all 0.2s ease;
      text-align: center; white-space: nowrap;
    }

    .tab-btn.active { background-color: var(--accent-primary); color: white; box-shadow: 0 2px 8px rgba(90, 103, 216, 0.25); }

    .theme-toggle-btn {
      background: var(--card-bg); border: 1.5px solid var(--input-border); color: var(--text-main);
      padding: 8px 12px; border-radius: 20px; font-size: 0.9rem; cursor: pointer; box-shadow: var(--shadow);
    }

    .card {
      background: var(--card-bg); border-radius: var(--radius); padding: 20px;
      box-shadow: var(--shadow); border: 1.5px solid var(--input-border); transition: background-color 0.3s ease, border-color 0.3s ease;
    }

    .card h2 { font-size: 1.1rem; margin-bottom: 6px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .subtitle { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 14px; line-height: 1.4; }

    .btn {
      background-color: var(--accent-primary); color: white; border: none; border-radius: 12px;
      padding: 12px 18px; font-size: 0.95rem; font-weight: 600; cursor: pointer; width: 100%; transition: all 0.2s ease;
    }
    .btn:hover { background-color: var(--accent-hover); transform: translateY(-1px); }
    .btn-secondary { background-color: var(--item-bg); border: 1.5px solid var(--input-border); color: var(--text-main); }
    .btn-small { padding: 6px 12px; font-size: 0.8rem; width: auto; border-radius: 8px; }

    .energy-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
    .energy-btn {
      background: var(--item-bg); border: 1.5px solid var(--input-border); color: var(--text-main);
      border-radius: 10px; padding: 10px; font-size: 0.85rem; cursor: pointer; text-align: center; transition: all 0.2s;
    }
    .energy-btn.selected { border-color: var(--accent-primary); background-color: rgba(90, 103, 216, 0.15); font-weight: 600; }

    textarea, input[type="text"], input[type="number"], input[type="date"], select {
      width: 100%; background: var(--input-bg); color: var(--text-main); border: 1.5px solid var(--input-border);
      border-radius: 10px; padding: 10px 12px; font-size: 0.9rem; margin-bottom: 10px; outline: none;
    }
    textarea:focus, input[type="text"]:focus, select:focus, input[type="date"]:focus { border-color: var(--accent-primary); }

    .item-list { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }
    .item-card {
      background: var(--item-bg); padding: 12px; border-radius: 12px; font-size: 0.9rem;
      display: flex; justify-content: space-between; align-items: center; border: 1.5px solid var(--input-border);
    }
    .item-card.done { background: var(--soft-green); border-color: var(--green-border); color: var(--green-text); text-decoration: line-through; }
    .time-badge { font-size: 0.72rem; color: var(--text-muted); display: block; margin-top: 2px; }

    .marble {
      width: 20px; height: 20px; border-radius: 50%; display: inline-block;
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.35), 1px 2px 4px rgba(0,0,0,0.2);
      animation: dropMarble 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes dropMarble { 0% { transform: translateY(-30px) scale(1.3); opacity: 0; } 100% { transform: translateY(0) scale(1); opacity: 1; } }

    .postit-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 14px; margin-top: 14px; }
    .postit {
      border-radius: 8px; padding: 16px 14px 12px 14px; box-shadow: 2px 4px 12px rgba(0,0,0,0.08);
      position: relative; border: 1.5px solid rgba(0,0,0,0.08); transform: rotate(-1deg); transition: all 0.2s ease;
      display: flex; flex-direction: column; justify-content: space-between; min-height: 130px;
    }
    .postit:nth-child(even) { transform: rotate(1.5deg); }
    .postit:hover { transform: scale(1.02) rotate(0deg); z-index: 10; }
    .postit-pin { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); font-size: 1.2rem; filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3)); }
    .postit-content { font-size: 0.92rem; line-height: 1.35; font-weight: 500; word-break: break-word; margin-top: 4px; }
    .postit-footer { display: flex; justify-content: space-between; align-items: flex-end; margin-top: 10px; font-size: 0.75rem; opacity: 0.9; border-top: 1px dashed rgba(0,0,0,0.18); padding-top: 6px; }
    .postit-menu-btn { background: none; border: none; font-size: 1.1rem; cursor: pointer; color: inherit; padding: 0 4px; }
    .postit-menu { position: absolute; bottom: 30px; right: 10px; background: var(--card-bg); border: 1.5px solid var(--input-border); border-radius: 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; padding: 6px; z-index: 20; min-width: 140px; }
    .postit-menu button { background: none; border: none; text-align: left; padding: 6px 10px; font-size: 0.78rem; color: var(--text-main); cursor: pointer; border-radius: 6px; }
    .postit-menu button:hover { background: var(--item-bg); }

    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.6);
      backdrop-filter: blur(4px); z-index: 10000; display: flex; justify-content: center; align-items: flex-start; padding: 16px; overflow-y: auto;
    }
    .modal-content {
      background: var(--card-bg); color: var(--text-main); width: 100%; max-width: 620px; border-radius: var(--radius);
                    <h3 class="font-bold text-gray-800 dark:text-gray-200">🗄️ Archief Vaste Lasten</h3>

                <!-- Dynamic Archive Items -->
            </div>
        </div>
    </div>
</div>

<div id="edit-archived-bill-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">

            </div>

                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Bedrag (€)</label>
                    <input type="number" step="0.01" id="edit-archived-bill-amount" required class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Frequentie</label>

                        <option value="jaarlijks">Jaarlijks</option>
                        <option value="kwartaal">Kwartaal</option>
                    </select>
                </div>
            </div>
            <div>
                <label class="block text-xs font-semibold text-gray-600 dark:text-gray-400 mb-1">Betaaldag van de maand</label>
                <input type="number" min="1" max="31" id="edit-archived-bill-day" required class="w-full px-3 py-2 text-sm border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-900 dark:text-gray-100 focus:outline-none focus:ring-2 focus:ring-indigo-500">

            <div class="flex justify-end gap-2 pt-2">
                <button type="button" onclick="closeModal('edit-archived-bill-modal')" class="px-4 py-2 text-xs font-medium text-gray-600 dark:text-gray-300 bg-gray-100 dark:bg-gray-700 rounded-xl hover:bg-gray-200 dark:hover:bg-gray-600">Annuleren</button>
                <button type="submit" class="px-4 py-2 text-xs font-semibold text-white bg-indigo-600 hover:bg-indigo-700 rounded-xl shadow-md">Opslaan</button>
            </div>
        </form>
    </div>
</div>

// Render & Filter Bill Archive Modal
function renderBillArchive() {
    const listEl = document.getElementById('bill-archive-list');
    if (!listEl) return;

    const searchTerm = (document.getElementById('archive-search-input')?.value || '').toLowerCase();
    const freqFilter = document.getElementById('archive-filter-frequency')?.value || 'all';

    const archivedBills = (appData.bills || []).filter(b => b.archived);

    const filtered = archivedBills.filter(bill => {
        const matchesSearch = bill.name.toLowerCase().includes(searchTerm) || 
                              (bill.amount && bill.amount.toString().includes(searchTerm));
        const matchesFreq = freqFilter === 'all' || bill.frequency === freqFilter;
        return matchesSearch && matchesFreq;
    });

    if (filtered.length === 0) {
        listEl.innerHTML = `
            <div class="text-center py-8 text-gray-400 text-sm">
                Geen gearchiveerde vaste lasten gevonden ${searchTerm || freqFilter !== 'all' ? 'met deze filters' : ''}.
            </div>`;
        return;
    }

    listEl.innerHTML = filtered.map(bill => `
        <div class="flex items-center justify-between p-3.5 bg-gray-50 dark:bg-gray-700/50 rounded-xl border border-gray-100 dark:border-gray-700 hover:border-indigo-200 transition-all">
            <div>
                <div class="font-semibold text-sm text-gray-800 dark:text-gray-200">${escapeHtml(bill.name)}</div>
                <div class="text-xs text-gray-500 dark:text-gray-400 flex items-center gap-2 mt-0.5">
                    <span class="font-medium text-indigo-600 dark:text-indigo-400">€${formatMoney(bill.amount)}</span>
                    <span>•</span>
                    <span class="capitalize">${bill.frequency || 'maandelijks'}</span>
                    <span>•</span>
                    <span>Dag ${bill.day}</span>
                </div>
            </div>
            <div class="flex items-center gap-1.5">
                <button onclick="openEditArchivedBillModal('${bill.id}')" title="Bewerken" class="p-2 text-gray-500 hover:text-indigo-600 dark:text-gray-400 dark:hover:text-indigo-400 bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-600 transition-colors">
                    ✏️
                </button>
                <button onclick="restoreArchivedBill('${bill.id}')" title="Terugzetten naar actief" class="p-2 text-emerald-600 hover:text-emerald-700 bg-emerald-50 dark:bg-emerald-900/30 rounded-lg shadow-sm border border-emerald-200 dark:border-emerald-800 transition-colors">
                    🔄 Herstellen
                </button>
            </div>
        </div>
    `).join('');
}

// Restore archived bill back to active state
function restoreArchivedBill(id) {
    const bill = appData.bills.find(b => b.id === id);

    bill.archived = false;
    saveData();
    renderBillArchive();
    if (typeof renderBills === 'function') renderBills();

// Open Edit Modal for Archived Bill
function openEditArchivedBillModal(id) {
    const bill = appData.bills.find(b => b.id === id);
    if (!bill) return;

    document.getElementById('edit-archived-bill-id').value = bill.id;
    document.getElementById('edit-archived-bill-name').value = bill.name;
    document.getElementById('edit-archived-bill-amount').value = bill.amount;

// Save Edited Archived Bill
function handleSaveEditedArchivedBill(e) {
    e.preventDefault();
    const id = document.getElementById('edit-archived-bill-id').value;
    const bill = appData.bills.find(b => b.id === id);
    if (!bill) return;

    bill.name = document.getElementById('edit-archived-bill-name').value.trim();
    bill.amount = parseFloat(document.getElementById('edit-archived-bill-amount').value) || 0;
    bill.frequency = document.getElementById('edit-archived-bill-frequency').value;

    saveData();
    closeModal('edit-archived-bill-modal');
    renderBillArchive();
    showToast('Gearchiveerde vaste last bijgewerkt!', 'success');
}

let chartInstances = {};

function handleInsightsFilterChange() {
    const tf = document.getElementById('insights-timeframe').value;
    const customDateEl = document.getElementById('insights-custom-date');
    if (tf === 'custom') {
        customDateEl.classList.remove('hidden');
    } else {
        customDateEl.classList.add('hidden');
    }
    renderInsightsView();
}

function renderInsightsView() {
    const timeframe = document.getElementById('insights-timeframe')?.value || '30';
    const customDate = document.getElementById('insights-custom-date')?.value;

    // Generate date sequence based on filter
    let daysCount = parseInt(timeframe);
    let datesList = [];

    const now = new Date();
    if (timeframe === 'all') {
        daysCount = 60; // Show last 60 points for 'all time' overview
    }

    if (timeframe === 'custom' && customDate) {
        datesList = [customDate];
    } else {
        for (let i = daysCount - 1; i >= 0; i--) {
            const d = new Date(now);
            d.setDate(d.getDate() - i);
            datesList.push(d.toISOString().split('T')[0]);
        }
    }

    // Extract logged data maps
    const moodMap = {};
    const sleepMap = {};
    const stepsMap = {};
    const tasksMap = {};
    const financeMap = {};

    (appData.moodLogs || []).forEach(log => {
        if (log.date) {
            moodMap[log.date] = log.score || 5;
            if (log.sleepHours) sleepMap[log.date] = log.sleepHours;
            if (log.steps) stepsMap[log.date] = log.steps;
        }
    });

    (appData.completedTasksHistory || appData.tasks || []).forEach(t => {
        if (t.completedAt) {
            const dateStr = t.completedAt.split('T')[0];
            tasksMap[dateStr] = (tasksMap[dateStr] || 0) + 1;
        }
    });

    (appData.savingsLogs || appData.extraPayments || []).forEach(item => {
        const dateStr = (item.date || item.timestamp || '').split('T')[0];
        if (dateStr) {
            financeMap[dateStr] = (financeMap[dateStr] || 0) + (parseFloat(item.amount) || 0);
        }
    });

    // Compute correlation summaries
    renderSmartInsightCards(datesList, moodMap, sleepMap, stepsMap, tasksMap, financeMap);

    // Render Charts
    renderChartSleepMood(datesList, sleepMap, moodMap);
    renderChartActivityMood(datesList, stepsMap, moodMap);
    renderChartTasksMarbles(datesList, tasksMap);
    renderChartFinanceMood(datesList, financeMap, moodMap);
}

function renderSmartInsightCards(datesList, moodMap, sleepMap, stepsMap, tasksMap, financeMap) {
    const container = document.getElementById('insights-smart-cards');
    if (!container) return;

    let sleepMoodSum = 0, sleepCount = 0;
    let highStepMoodSum = 0, lowStepMoodSum = 0, highStepCnt = 0, lowStepCnt = 0;

    datesList.forEach(d => {
        const mood = moodMap[d];
        const sleep = sleepMap[d];
        const steps = stepsMap[d];

        if (mood && sleep) {
            if (sleep >= 7) sleepMoodSum += mood;
            sleepCount++;
        }
        if (mood && steps) {
            if (steps >= 7000) { highStepMoodSum += mood; highStepCnt++; }
            else { lowStepMoodSum += mood; lowStepCnt++; }
        }
    });

    const avgHighStepMood = highStepCnt ? (highStepMoodSum / highStepCnt).toFixed(1) : '7.5';
    const totalFin = Object.values(financeMap).reduce((a, b) => a + b, 0);

    container.innerHTML = `
        <div class="bg-gradient-to-br from-indigo-50 to-blue-50 dark:from-indigo-950/40 dark:to-blue-900/20 p-4 rounded-2xl border border-indigo-100 dark:border-indigo-900/50">
            <div class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 flex items-center gap-1 mb-1">
                <span>⚡ Energy &amp; Rest Insight</span>
            </div>
            <div class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-1">Nachtrust Correlatie</div>
            <p class="text-xs text-gray-600 dark:text-gray-300">
                Op dagen met &gt;7u slaap is je gemiddelde mood <strong>${sleepCount ? (sleepMoodSum/sleepCount).toFixed(1) : '8.2'}/10</strong>. Goede rust booster je energie direct!
            </p>
        </div>

        <div class="bg-gradient-to-br from-emerald-50 to-teal-50 dark:from-emerald-950/40 dark:to-teal-900/20 p-4 rounded-2xl border border-emerald-100 dark:border-emerald-900/50">
            <div class="text-xs font-semibold text-emerald-600 dark:text-emerald-400 flex items-center gap-1 mb-1">
                <span>🏃 Beweging Impact</span>
            </div>
            <div class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-1">Activiteit vs. Humour</div>
            <p class="text-xs text-gray-600 dark:text-gray-300">
                Bij meer dan 7.000 stappen scoort je dag gemiddeld een <strong>${avgHighStepMood}</strong>. Beweging helpt spanning ontladen.
            </p>
        </div>

        <div class="bg-gradient-to-br from-purple-50 to-pink-50 dark:from-purple-950/40 dark:to-pink-900/20 p-4 rounded-2xl border border-purple-100 dark:border-purple-900/50">
            <div class="text-xs font-semibold text-purple-600 dark:text-purple-400 flex items-center gap-1 mb-1">
                <span>💡 Financiële Rust</span>
            </div>
            <div class="text-xl font-bold text-gray-800 dark:text-gray-100 mb-1">€${formatMoney(totalFin)} Bespaard/Aafgelost</div>
            <p class="text-xs text-gray-600 dark:text-gray-300">
                Aflossingen en extra zeges zorgen aantoonbaar voor een stabielere rust in je weekoverzicht.
            </p>
        </div>
    `;
}

function destroyChart(id) {
    if (chartInstances[id]) {
        chartInstances[id].destroy();
        delete chartInstances[id];
    }
}

function renderChartSleepMood(labels, sleepMap, moodMap) {
    destroyChart('chart-sleep-mood');
    const ctx = document.getElementById('chart-sleep-mood')?.getContext('2d');
    if (!ctx) return;

    const sleepData = labels.map(l => sleepMap[l] || null);
    const moodData = labels.map(l => moodMap[l] || null);

    chartInstances['chart-sleep-mood'] = new Chart(ctx, {
        type: 'line',
        data: {
            labels: labels.map(l => l.slice(5)),
            datasets: [
                {
                    label: 'Slaap (uren)',
                    data: sleepData,
                    borderColor: '#6366f1',
                    backgroundColor: 'rgba(99, 102, 241, 0.1)',
                    yAxisID: 'y',
                    tension: 0.3,
                    fill: true
                },
                {
                    label: 'Mood (1-10)',
                    data: moodData,
                    borderColor: '#ec4899',
                    borderDash: [5, 5],
                    yAxisID: 'y1',
                    tension: 0.3
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                y: { type: 'linear', position: 'left', min: 0, max: 12, title: { display: true, text: 'Uren Slaap' } },
                y1: { type: 'linear', position: 'right', min: 0, max: 10, grid: { drawOnChartArea: false }, title: { display: true, text: 'Mood Score' } }
            }
        }
    });

      dlAnchor.setAttribute("href", dataStr);
      dlAnchor.setAttribute("download", `Voldaan_Backup_${new Date().toISOString().slice(0,10)}.json`);

      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const imported = JSON.parse(e.target.result);
          Object.keys(imported).forEach(key => {
            if (key.startsWith('voldaan_')) {
              localStorage.setItem(key, imported[key]);
            }
          });
          alert("🎉 Backup succesvol geïmporteerd! De pagina wordt opnieuw geladen.");
          window.location.reload();
        } catch (err) {

        }
      };
      reader.readAsText(file);

    function getPaydayDate(year, month) {
      let d = new Date(year, month, 23, 8, 0, 0, 0);
      let dayOfWeek = d.getDay();
      if (dayOfWeek === 6) d.setDate(22);
      else if (dayOfWeek === 0) d.setDate(21);
      return d;
    }

    function calculatePaydayInfo() {
      const now = new Date();
      let year = now.getFullYear();
      let month = now.getMonth();
      let paydayThisMonth = getPaydayDate(year, month);
      
      const isPaydayToday = (now.getFullYear() === paydayThisMonth.getFullYear() && now.getMonth() === paydayThisMonth.getMonth() && now.getDate() === paydayThisMonth.getDate());
      if (isPaydayToday && now >= paydayThisMonth) return { isPaydayNow: true, paydayDate: paydayThisMonth };

      let targetPayday = paydayThisMonth;
      if (now >= paydayThisMonth && !isPaydayToday) {
        if (month === 11) targetPayday = getPaydayDate(year + 1, 0);
        else targetPayday = getPaydayDate(year, month + 1);
      }
      return { isPaydayNow: false, paydayDate: targetPayday };
    }

    function updatePaydayCountdown() {
      const paydayInfo = calculatePaydayInfo();
      const countdownBox = document.getElementById('payday-countdown-box');
      const celebrationBox = document.getElementById('payday-celebration-box');
      const targetText = document.getElementById('payday-target-date-text');

      if (!countdownBox || !celebrationBox || !targetText) return;

      if (paydayInfo.isPaydayNow) {
        countdownBox.classList.add('hidden');
        celebrationBox.classList.remove('hidden');
        targetText.innerText = "🎉 Vandaag is jouw Payday!";
      } else {
        celebrationBox.classList.add('hidden');
        countdownBox.classList.remove('hidden');

        const now = new Date().getTime();
        const diff = paydayInfo.paydayDate.getTime() - now;

        if (diff <= 0) { updatePaydayCountdown(); return; }

        const days = Math.floor(diff / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
        const seconds = Math.floor((diff % (1000 * 60)) / 1000);

        document.getElementById('pd-days').innerText = String(days).padStart(2, '0');
        document.getElementById('pd-hours').innerText = String(hours).padStart(2, '0');
        document.getElementById('pd-mins').innerText = String(minutes).padStart(2, '0');
        document.getElementById('pd-secs').innerText = String(seconds).padStart(2, '0');

        targetText.innerText = `Eerstvolgende: ${paydayInfo.paydayDate.toLocaleDateString('nl-NL', { weekday: 'short', day: 'numeric', month: 'short' })} (08:00)`;
      }
    }

      if (activeTasks.length === 0) {
        todayTasksBox.innerHTML = '<span style="font-size:0.82rem; color:var(--text-muted);">Geen actieve focus-taken voor vandaag. Rustig aan! 🎉</span>';
      } else {
        activeTasks.slice(0, 3).forEach(task => {
          const div = document.createElement('div');
          div.className = 'item-card';
          div.innerHTML = `
            <span style="cursor:pointer;" onclick="toggleTask(${task.id})">⚪ <strong>[${task.category || 'Privé'}]</strong> ${task.text}</span>
            <button class="btn btn-small" style="font-size:0.75rem; padding: 4px 8px;" onclick="toggleTask(${task.id})">✅ Afvinken</button>
          `;
          todayTasksBox.appendChild(div);
        });
      }

      let goals = JSON.parse(localStorage.getItem('voldaan_compass_goals') || '[]');
      const todayGoalsBox = document.getElementById('today-goals-list');
      todayGoalsBox.innerHTML = '';
      const todayStr = new Date().toLocaleDateString('nl-NL');

      if (goals.length === 0) {
        todayGoalsBox.innerHTML = '<span style="font-size:0.82rem; color:var(--text-muted);">Nog geen langetermijndoelen ingesteld.</span>';
      } else {
        goals.forEach(goal => {
          const isToday = goal.lastLoggedDate === todayStr;
          const div = document.createElement('div');
          div.className = 'item-card';
          
          if (isToday) {
            let label = goal.lastStatus === 'full' ? '✅ Gelukt!' : goal.lastStatus === 'shield' ? '🛡️ Zacht Schild' : '🍃 Rustdag';
            div.innerHTML = `<span>🎯 ${goal.title}</span><span style="font-size:0.8rem; font-weight:600; color:var(--accent-primary);">${label}</span>`;
          } else {
            div.innerHTML = `
              <span>🎯 ${goal.title}</span>
              <div style="display:flex; gap:4px;">
                <button class="btn btn-small" style="font-size:0.72rem; padding:4px 6px; background-color:#38A169;" onclick="logGoalAction(${goal.id}, 'full')">✅</button>
                ${goal.shield ? `<button class="btn btn-secondary btn-small" style="font-size:0.72rem; padding:4px 6px; background-color:#3182CE; color:white;" onclick="logGoalAction(${goal.id}, 'shield')">🛡️</button>` : ''}
              </div>
            `;

          todayGoalsBox.appendChild(div);
        });
      }

      renderTodayRandomIdea();
      updateStats();

    function archiveIdea(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');

      if (idx !== -1) {

        currentGrabbelIdea = null;
        renderTodayRandomIdea();
        renderIdeas();
      }

    function restoreIdea(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const idx = ideas.findIndex(i => i.id === id);
      if (idx !== -1) {
        ideas[idx].archived = false;
        localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));
        renderIdeas();
        renderIdeasArchiveModal();

    function updateStats() {
      document.getElementById('stat-starts').innerText = localStorage.getItem('voldaan_stat_starts') || '0';
      document.getElementById('stat-pacts').innerText = localStorage.getItem('voldaan_stat_pacts') || '0';
      document.getElementById('stat-tasks').innerText = localStorage.getItem('voldaan_stat_tasks') || '0';
      
      let bills = JSON.parse(localStorage.getItem('voldaan_fixed_bills') || '[]');
      let paidBills = bills.filter(b => b.paid).length;
      let anchors = JSON.parse(localStorage.getItem('voldaan_future_anchors') || '[]');
      let savedAnchors = anchors.filter(a => a.saved).length;
      let repayments = JSON.parse(localStorage.getItem('voldaan_ruimte_projects') || '[]').reduce((sum, p) => sum + (p.history ? p.history.filter(h => h.type==='payment').length : 0), 0);
      
      let marbles = JSON.parse(localStorage.getItem('voldaan_marbles') || '[]');
      let moneyMarbles = marbles.filter(m => m.category === 'Geld & Aflossingen').length;

      document.getElementById('stat-money').innerText = paidBills + savedAnchors + repayments + moneyMarbles;

    function updateInsight() {
      const pacts = parseInt(localStorage.getItem('voldaan_stat_pacts') || '0');
      const tasks = parseInt(localStorage.getItem('voldaan_stat_tasks') || '0');
      let text = "Je bouwt stap voor stap aan je eigen ritme. Er is geen haast!";
      if (pacts > 0) text = `Je hebt al ${pacts}x een Avond-pact afgerond! Zachte voorbereiding geeft je brein meer rust.`;
      else if (tasks >= 3) text = `Je hebt al ${tasks} kleine acties afgevinkt zonder prestatiedruk. Lekker bezig!`;
      document.getElementById('insight-text').innerText = text;

    const taskCatIcons = { 'Privé': '🏠', 'Gezin': '👨‍👩‍👧‍👦', 'Werk': '💼', 'Klussen': '🔨', 'Vrije tijd': '🎨', 'Gezondheid': '🍎', 'Financieel': '💶' };

    function addTask(textInput, categoryInput) {
      const input = textInput || document.getElementById('task-input').value;
      const categorySelect = categoryInput || (document.getElementById('task-category-select') ? document.getElementById('task-category-select').value : 'Privé');
      if (!input.trim()) return;

      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      tasks.unshift({ id: Date.now(), text: input.trim(), category: categorySelect || 'Privé', done: false, created: getNowDateTimeStr(), doneAt: null });

      localStorage.setItem('voldaan_tasks', JSON.stringify(tasks));
      if (!textInput) document.getElementById('task-input').value = '';
      renderTasks();
      renderTodayDashboard();
    }

    function editTask(id) {
      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      const task = tasks.find(t => t.id === id);
      if (!task) return;

      const newText = prompt("Pas de taak aan:", task.text);
      if (newText !== null && newText.trim() !== '') {
        task.text = newText.trim();
        localStorage.setItem('voldaan_tasks', JSON.stringify(tasks));
        renderTasks();
        renderTodayDashboard();
      }
    }

    function toggleTask(id) {
      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      const idx = tasks.findIndex(t => t.id === id);
      if (idx !== -1) {
        tasks[idx].done = !tasks[idx].done;
        if (tasks[idx].done) {
          tasks[idx].doneAt = getNowDateTimeStr();
          localStorage.setItem('voldaan_stat_tasks', parseInt(localStorage.getItem('voldaan_stat_tasks') || '0') + 1);
          triggerConfetti();
          addMarble(`Taak gelukt: "${tasks[idx].text}"`, 'Taken');
        }
        localStorage.setItem('voldaan_tasks', JSON.stringify(tasks));
        renderTasks();
        renderTodayDashboard();
        if (!document.getElementById('task-archive-modal').classList.contains('hidden')) renderTaskArchiveModal();
      }
    }

    function removeTask(id) {
      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      tasks = tasks.filter(t => t.id !== id);
      localStorage.setItem('voldaan_tasks', JSON.stringify(tasks));
      renderTasks();
      renderTodayDashboard();
      if (!document.getElementById('task-archive-modal').classList.contains('hidden')) renderTaskArchiveModal();
    }

    function openTaskArchiveModal() {
      document.getElementById('task-archive-modal').classList.remove('hidden');
      renderTaskArchiveModal();
    }

    function closeTaskArchiveModal() {
      document.getElementById('task-archive-modal').classList.add('hidden');
    }

    function renderTaskArchiveModal() {
      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      const doneTasks = tasks.filter(t => t.done).sort((a,b) => b.id - a.id);
      const container = document.getElementById('task-archive-modal-list');
      container.innerHTML = '';

      if (doneTasks.length === 0) {
        container.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted);">Nog geen voltooide taken in het archief.</span>';
        return;
      }

      doneTasks.forEach(task => {
        const cat = task.category || 'Privé';
        const icon = taskCatIcons[cat] || '🏷️';
        const div = document.createElement('div');
        div.className = 'item-card done';
        div.innerHTML = `
          <div>
            <span>✅ <strong>[${icon} ${cat}]</strong> ${task.text}</span>
            <span class="time-badge">Voltooid: ${task.doneAt || 'Eerder'}</span>
          </div>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-small" style="font-size:0.75rem; background-color:#38A169; color:white;" onclick="toggleTask(${task.id})">🔄 Terugzetten</button>
            <button style="background:none; border:none; color:#E53E3E; cursor:pointer;" onclick="removeTask(${task.id})">✕</button>
          </div>
        `;
        container.appendChild(div);
      });

    function renderTasks() {
      let tasks = JSON.parse(localStorage.getItem('voldaan_tasks') || '[]');
      const container = document.getElementById('tasks-list');
      if (!container) return;

      container.innerHTML = '';

      const filterCat = document.getElementById('tasks-filter-category') ? document.getElementById('tasks-filter-category').value : 'ALL';
      let filteredTasks = filterCat !== 'ALL' ? tasks.filter(t => (t.category || 'Privé') === filterCat) : tasks;

      const activeTasks = filteredTasks.filter(t => !t.done).sort((a,b) => b.id - a.id);

      if (activeTasks.length === 0) {
        container.innerHTML = '<span style="font-size:0.82rem; color:var(--text-muted);">Geen actieve taken. Neem heerlijk rust!</span>';
        return;
      }

      activeTasks.forEach((task) => {
        const cat = task.category || 'Privé';
        const icon = taskCatIcons[cat] || '🏷️';
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <div>
            <span style="cursor:pointer;" onclick="toggleTask(${task.id})">⚪ <strong style="font-size:0.78rem; opacity:0.85;">[${icon} ${cat}]</strong> ${task.text}</span>
            <span class="time-badge">Aangemaakt: ${task.created}</span>
          </div>
          <div style="display:flex; gap:4px; align-items:center;">
            <button class="btn btn-secondary btn-small" style="font-size:0.72rem; padding:3px 6px; background-color:#3182CE; color:white;" onclick="pushTaskToCalendar('${task.text.replace(/'/g, "\\'")}')">📅 Agenda</button>
            <button class="btn btn-secondary btn-small" style="font-size:0.72rem; padding:3px 6px;" onclick="editTask(${task.id})">✏️</button>
            <button class="btn btn-small" style="font-size:0.72rem; padding:3px 6px; background-color:#38A169;" onclick="toggleTask(${task.id})">✅</button>
            <button style="background:none; border:none; color:#E53E3E; cursor:pointer;" onclick="removeTask(${task.id})">✕</button>
          </div>
        `;
        container.appendChild(div);

    function logGoalAction(goalId, status) {
      let goals = JSON.parse(localStorage.getItem('voldaan_compass_goals') || '[]');
      const idx = goals.findIndex(g => g.id === goalId);
      if (idx !== -1) {
        goals[idx].lastLoggedDate = new Date().toLocaleDateString('nl-NL');
        goals[idx].lastStatus = status;
        localStorage.setItem('voldaan_compass_goals', JSON.stringify(goals));

        if (status === 'full' || status === 'shield') {
          triggerConfetti();
          addMarble(`Doel actie: "${goals[idx].title}"`, 'Doelen');
        }
        renderCompassGoals();
        renderTodayDashboard();
      }
    }

    function resetGoalLog(goalId) {
      let goals = JSON.parse(localStorage.getItem('voldaan_compass_goals') || '[]');
      const idx = goals.findIndex(g => g.id === goalId);
      if (idx !== -1) {
        goals[idx].lastLoggedDate = null;
        goals[idx].lastStatus = null;
        localStorage.setItem('voldaan_compass_goals', JSON.stringify(goals));
        renderCompassGoals();
        renderTodayDashboard();
      }
    }

    function removeCompassGoal(goalId) {
      if (confirm("Wil je dit langetermijndoel verwijderen?")) {
        let goals = JSON.parse(localStorage.getItem('voldaan_compass_goals') || '[]');
        goals = goals.filter(g => g.id !== goalId);
        localStorage.setItem('voldaan_compass_goals', JSON.stringify(goals));
        renderCompassGoals();
        renderTodayDashboard();
      }
    }

    function renderCompassGoals() {
      let goals = JSON.parse(localStorage.getItem('voldaan_compass_goals') || '[]');
      const container = document.getElementById('compass-goals-list');
      if (!container) return;
      container.innerHTML = '';

      const todayStr = new Date().toLocaleDateString('nl-NL');

      if (goals.length === 0) {
        container.innerHTML = '<span style="font-size:0.82rem; color:var(--text-muted);">Nog geen doelen.</span>';
        return;
      }

      goals.forEach(goal => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.style.flexDirection = 'column';
        card.style.alignItems = 'stretch';
        card.style.gap = '8px';

        const isToday = goal.lastLoggedDate === todayStr;

        let statusHtml = '';
        if (isToday) {
          let label = goal.lastStatus === 'full' ? '✅ Volledig gelukt vandaag! 🎉' : goal.lastStatus === 'shield' ? '🛡️ Zacht Schild ingezet! 💜' : '🍃 Rustdag genomen.';
          statusHtml = `
            <div style="display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:8px 10px; border-radius:8px; border:1.5px solid var(--input-border);">
              <span style="font-size:0.85rem; font-weight:600;">${label}</span>
              <button class="btn btn-secondary btn-small" style="font-size:0.75rem; padding:2px 6px;" onclick="resetGoalLog(${goal.id})">Wijzigen</button>
            </div>
          `;
        } else {
          statusHtml = `
            <div class="btn-group" style="margin-top:0;">
              <button class="btn btn-small" style="background-color:#38A169; color:white;" onclick="logGoalAction(${goal.id}, 'full')">✅ Volledig</button>
              ${goal.shield ? `<button class="btn btn-secondary btn-small" style="background-color:#3182CE; color:white;" onclick="logGoalAction(${goal.id}, 'shield')">🛡️ Zacht Schild</button>` : ''}
              <button class="btn btn-secondary btn-small" onclick="logGoalAction(${goal.id}, 'rest')">🍃 Rustdag</button>
            </div>
          `;
        }

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <strong style="font-size:0.95rem;">🎯 ${goal.title}</strong>
              ${goal.pitfall ? `<div style="font-size:0.78rem; color:var(--text-muted); margin-top:2px;">🕳️ Valkuil: ${goal.pitfall}</div>` : ''}
              ${goal.shield ? `<div style="font-size:0.78rem; color:var(--accent-primary); font-weight:500; margin-top:2px;">🛡️ Zacht Schild: ${goal.shield}</div>` : ''}
            </div>
            <button style="background:none; border:none; color:#E53E3E; cursor:pointer;" onclick="removeCompassGoal(${goal.id})">✕</button>
          </div>
          ${statusHtml}
        `;
        container.appendChild(card);
      });
    }

    let openMenuId = null;

    const categoryColors = {
      'Algemeen': { light: '#FEF08A', dark: '#B45309', textLight: '#1E293B', textDark: '#FFFBEB' },
      'Voldaan': { light: '#FBCFE8', dark: '#9D174D', textLight: '#1E293B', textDark: '#FFFBEB' },
      'Creatief': { light: '#FED7AA', dark: '#C2410C', textLight: '#1E293B', textDark: '#FFFBEB' },
      'Werk / Studie': { light: '#BAE6FD', dark: '#0369A1', textLight: '#1E293B', textDark: '#FFFBEB' },
      'Privé / Thuis': { light: '#BBF7D0', dark: '#15803D', textLight: '#1E293B', textDark: '#FFFBEB' }
    };

    function getPostitStyle(category) {
      const isDark = document.body.classList.contains('dark-theme');
      if (categoryColors[category]) {
        const c = categoryColors[category];
        return `background-color: ${isDark ? c.dark : c.light}; color: ${isDark ? c.textDark : c.textLight};`;
      }
      return `background-color: ${isDark ? '#4A5568' : '#EDF2F7'}; color: ${isDark ? '#FFFBEB' : '#1E293B'};`;
    }

    // --- CATEGORIEEN & INITIALISATIE MET MIGRATIE ---
    function getCategories() {
      let cats = JSON.parse(localStorage.getItem('voldaan_categories') || 'null');
      if (!cats) {
        cats = ["Algemeen", "Voldaan", "Creatief", "Werk / Studie", "Privé / Thuis"];
        localStorage.setItem('voldaan_categories', JSON.stringify(cats));
      } else {
        if (cats.includes("Creatief") && !cats.includes("Voldaan")) {
          const idx = cats.indexOf("Creatief");
          cats[idx] = "Voldaan";
          cats.push("Creatief");
          localStorage.setItem('voldaan_categories', JSON.stringify(cats));
        }
      }
      return cats;
    }

    function migrateCreatiefToVoldaan() {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      let updated = false;
      ideas.forEach(i => {
        if (i.category === 'Creatief') {
          i.category = 'Voldaan';
          updated = true;
        }
      });
      if (updated) {
        localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));
      }
    }

    function addNewCategoryPrompt() {
      const newCat = prompt("Voer de naam van een nieuwe categorie in:");
      if (newCat && newCat.trim()) {
        let cats = getCategories();
        if (!cats.includes(newCat.trim())) {
          cats.push(newCat.trim());
          localStorage.setItem('voldaan_categories', JSON.stringify(cats));
          updateCategoryDropdowns();
        }
      }
    }

    function openManageCategoriesModal() {
      document.getElementById('manage-categories-modal').classList.remove('hidden');
      renderManageCategoriesModal();
    }

    function closeManageCategoriesModal() {
      document.getElementById('manage-categories-modal').classList.add('hidden');
    }

    function renderManageCategoriesModal() {
      const container = document.getElementById('categories-manage-list');
      const cats = getCategories();
      container.innerHTML = '';

      cats.forEach((c) => {
        const div = document.createElement('div');
        div.className = 'item-card';
        div.innerHTML = `
          <strong>🏷️ ${c}</strong>
          <div style="display:flex; gap:6px;">
            <button class="btn btn-secondary btn-small" style="font-size:0.75rem; padding:3px 8px;" onclick="renameCategoryPrompt('${c.replace(/'/g, "\\'")}')">✏️ Hernoemen</button>
            <button class="btn btn-secondary btn-small" style="font-size:0.75rem; color:#E53E3E; padding:3px 8px;" onclick="deleteCategory('${c.replace(/'/g, "\\'")}')">🗑️ Wis</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function saveCategoryFromModal() {
      const input = document.getElementById('new-category-input');
      const name = input.value.trim();
      if (!name) return;

      let cats = getCategories();
      if (!cats.includes(name)) {
        cats.push(name);
        localStorage.setItem('voldaan_categories', JSON.stringify(cats));
        updateCategoryDropdowns();
        renderManageCategoriesModal();
      }
      input.value = '';
    }

    function renameCategoryPrompt(oldName) {
      const newName = prompt(`Geef categorie "${oldName}" een nieuwe naam:`, oldName);
      if (!newName || !newName.trim() || newName.trim() === oldName) return;

      let cats = getCategories();
      const idx = cats.indexOf(oldName);
      if (idx !== -1) {
        cats[idx] = newName.trim();
        localStorage.setItem('voldaan_categories', JSON.stringify(cats));
      }

      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      ideas.forEach(i => { if (i.category === oldName) i.category = newName.trim(); });
      localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));

      updateCategoryDropdowns();
      renderManageCategoriesModal();
      renderIdeas();
    }

    function deleteCategory(catName) {
      let cats = getCategories();
      if (cats.length <= 1) { alert("Je moet minimaal 1 categorie overhouden."); return; }
      if (confirm(`Wil je de categorie "${catName}" verwijderen? Ideeën in deze categorie worden verplaatst naar Algemeen.`)) {
        cats = cats.filter(c => c !== catName);
        localStorage.setItem('voldaan_categories', JSON.stringify(cats));

        let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
        ideas.forEach(i => { if (i.category === catName) i.category = 'Algemeen'; });
        localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));

        updateCategoryDropdowns();
        renderManageCategoriesModal();
        renderIdeas();
      }
    }

    function updateCategoryDropdowns() {
      const cats = getCategories();
      const addSelect = document.getElementById('idea-category-select');
      const filterSelect = document.getElementById('ideas-modal-filter-category');

      if (!addSelect) return;
      addSelect.innerHTML = '';
      if (filterSelect) filterSelect.innerHTML = '<option value="ALL">📂 Alle categorieën</option>';

      cats.forEach(c => {
        addSelect.innerHTML += `<option value="${c}">${c}</option>`;
        if (filterSelect) filterSelect.innerHTML += `<option value="${c}">${c}</option>`;
      });
    }

    function addIdea() {
      const input = document.getElementById('idea-input');
      const catSelect = document.getElementById('idea-category-select');
      if (!input.value.trim()) return;

      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      ideas.unshift({ id: Date.now(), text: input.value.trim(), category: catSelect.value || 'Algemeen', created: getNowDateTimeStr(), archived: false });
      localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));
      input.value = '';
      renderIdeas();
      renderTodayDashboard();
    }

    function togglePostitMenu(id, e) {
      e.stopPropagation();
      openMenuId = (openMenuId === id) ? null : id;
      renderIdeas();
      if (!document.getElementById('all-ideas-modal').classList.contains('hidden')) renderAllIdeasModal();
    }

    function moveIdeaToPlanbord(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const idea = ideas.find(i => i.id === id);
      if (idea) { addTask(idea.text, 'Privé'); alert(`🎯 "${idea.text}" toegevoegd aan je Zacht Planbord!`); }
      openMenuId = null;
    }

    function convertIdeaToProject(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const idea = ideas.find(i => i.id === id);
      if (!idea) return;

      let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
      projects.unshift({ id: Date.now(), title: idea.text, description: `Post-it (${idea.category})`, category: idea.category, created: getNowDateTimeStr(), archived: false, tasks: [] });
      localStorage.setItem('voldaan_projects', JSON.stringify(projects));
      alert(`🚀 "${idea.text}" omgezet naar een Project!`);
      openMenuId = null;
      renderProjects();
    }

    function editIdeaText(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const idea = ideas.find(i => i.id === id);
      if (idea) {
        const newText = prompt("Pas je idee aan:", idea.text);
        if (newText !== null && newText.trim() !== "") {
          idea.text = newText.trim();
          localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));
          renderIdeas();
          renderTodayDashboard();
        }
      }
      openMenuId = null;
    }

    function removeIdea(id) {
      let ideas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      ideas = ideas.filter(i => i.id !== id);
      localStorage.setItem('voldaan_ideas', JSON.stringify(ideas));
      renderIdeas();
      renderTodayDashboard();
      if (!document.getElementById('all-ideas-modal').classList.contains('hidden')) renderAllIdeasModal();
    }

    function createPostitElement(idea) {
      const postit = document.createElement('div');
      postit.className = 'postit';
      postit.style.cssText = getPostitStyle(idea.category);
      const isMenuOpen = openMenuId === idea.id;

      postit.innerHTML = `
        <div class="postit-pin">📌</div>
        <div class="postit-content">${idea.text}</div>
        <div class="postit-footer">
          <span>🏷️ <strong>${idea.category}</strong><br>🕒 ${idea.created}</span>
          <button class="postit-menu-btn" onclick="togglePostitMenu(${idea.id}, event)">⋮</button>
        </div>
        ${isMenuOpen ? `
          <div class="postit-menu" onclick="event.stopPropagation()">
            <button onclick="moveIdeaToPlanbord(${idea.id})">🎯 Naar Planbord</button>
            <button onclick="convertIdeaToProject(${idea.id})">🚀 Maak Project</button>
            <button onclick="editIdeaText(${idea.id})">✏️ Tekst bewerken</button>
            <button onclick="archiveIdea(${idea.id})">🍃 Niet meer relevant</button>
            <button onclick="removeIdea(${idea.id})" style="color:#E53E3E;">🗑️ Verwijderen</button>
          </div>
        ` : ''}
      `;
      return postit;
    }

    function renderIdeas() {
      let allIdeas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const grid = document.getElementById('main-ideas-postit-grid');
      if (!grid) return;
      grid.innerHTML = '';

      const activeIdeas = allIdeas.filter(i => !i.archived).sort((a,b) => b.id - a.id);
      const newestIdeas = activeIdeas.slice(0, 3);

      if (newestIdeas.length === 0) {
        grid.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted); grid-column: 1/-1;">Geen actieve Post-its in je kluis. Prik er een op!</span>';
      } else {
        newestIdeas.forEach(idea => grid.appendChild(createPostitElement(idea)));
      }
    }

    function openAllIdeasModal() { document.getElementById('all-ideas-modal').classList.remove('hidden'); renderAllIdeasModal(); }
    function closeAllIdeasModal() { document.getElementById('all-ideas-modal').classList.add('hidden'); }

    function renderAllIdeasModal() {
      let allIdeas = JSON.parse(localStorage.getItem('voldaan_ideas') || '[]');
      const grid = document.getElementById('modal-ideas-postit-grid');
      const searchVal = document.getElementById('ideas-modal-search-input') ? document.getElementById('ideas-modal-search-input').value.toLowerCase() : '';
      const catVal = document.getElementById('ideas-modal-filter-category') ? document.getElementById('ideas-modal-filter-category').value : 'ALL';
      const sortVal = document.getElementById('ideas-modal-sort-select') ? document.getElementById('ideas-modal-sort-select').value : 'NEWEST';

      grid.innerHTML = '';

      let filtered = allIdeas.filter(i => !i.archived);

      if (searchVal) filtered = filtered.filter(i => i.text.toLowerCase().includes(searchVal));
      if (catVal !== 'ALL') filtered = filtered.filter(i => i.category === catVal);

      if (sortVal === 'NEWEST') filtered.sort((a,b) => b.id - a.id);
      else if (sortVal === 'OLDEST') filtered.sort((a,b) => a.id - b.id);
      else if (sortVal === 'SHUFFLE') filtered.sort(() => Math.random() - 0.5);

      if (filtered.length === 0) {
        grid.innerHTML = '<span style="font-size:0.85rem; color:var(--text-muted); grid-column: 1/-1;">Geen ideeën gevonden.</span>';
      } else {
        filtered.forEach(idea => grid.appendChild(createPostitElement(idea)));
      }
    }

    function toggleAddProjectForm() { document.getElementById('add-project-form').classList.toggle('hidden'); }

    function saveNewProject() {
      const title = document.getElementById('project-title-input').value;
      const desc = document.getElementById('project-desc-input').value;
      if (!title.trim()) return;

      let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
      projects.unshift({ id: Date.now(), title: title.trim(), description: desc.trim(), created: getNowDateTimeStr(), archived: false, tasks: [] });

      localStorage.setItem('voldaan_projects', JSON.stringify(projects));
      document.getElementById('project-title-input').value = '';
      document.getElementById('project-desc-input').value = '';
      toggleAddProjectForm();
      renderProjects();
    }

    function addProjectSubTask(projectId) {
      const text = prompt("Voeg een sub-taak toe aan dit project:");
      if (!text || !text.trim()) return;

      let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
      const p = projects.find(item => item.id === projectId);
      if (p) {
        if (!p.tasks) p.tasks = [];
        p.tasks.unshift({ id: Date.now(), text: text.trim(), done: false });
        localStorage.setItem('voldaan_projects', JSON.stringify(projects));
        renderProjects();
      }
    }

    function toggleProjectSubTask(projectId, taskId) {
      let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
      const p = projects.find(item => item.id === projectId);
      if (p && p.tasks) {
        const t = p.tasks.find(tk => tk.id === taskId);
        if (t) {
          t.done = !t.done;
          if (t.done) { addMarble(`Subtaak project [${p.title}] afgerond`, 'Taken'); triggerConfetti(); }
          localStorage.setItem('voldaan_projects', JSON.stringify(projects));
          renderProjects();
        }
      }
    }

    function deleteProject(id) {
      if (confirm("Wil je dit project verwijderen?")) {
        let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
        projects = projects.filter(p => p.id !== id);
        localStorage.setItem('voldaan_projects', JSON.stringify(projects));
        renderProjects();
      }
    }

    function renderProjects() {
      let projects = JSON.parse(localStorage.getItem('voldaan_projects') || '[]');
      const container = document.getElementById('projects-compact-list');
      if (!container) return;
      container.innerHTML = '';

      const activeProjects = projects.filter(p => !p.archived).sort((a,b) => b.id - a.id).slice(0, 3);

      if (activeProjects.length === 0) {
        container.innerHTML = '<span style="font-size:0.82rem; color:var(--text-muted);">Nog geen actieve projecten.</span>';
        return;
      }

      activeProjects.forEach(p => {
        const card = document.createElement('div');
        card.className = 'item-card';
        card.style.flexDirection = 'column';
        card.style.alignItems = 'stretch';
        card.style.gap = '8px';

        let subtasksHtml = (p.tasks && p.tasks.length > 0) ? p.tasks.map(t => `
          <div style="display:flex; justify-content:space-between; align-items:center; background:var(--input-bg); padding:6px 8px; border-radius:6px; font-size:0.8rem; border: 1px solid var(--input-border);">
            <span style="${t.done ? 'text-decoration:line-through; opacity:0.7;' : ''}" onclick="toggleProjectSubTask(${p.id}, ${t.id})">${t.done ? '✅' : '⚪'} ${t.text}</span>
          </div>
        `).join('') : '<span style="font-size:0.75rem; color:var(--text-muted);">Geen sub-taken.</span>';

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <strong style="font-size:0.95rem;">🚀 ${p.title}</strong>
              <div style="font-size:0.78rem; color:var(--text-muted);">${p.description}</div>
            </div>
            <button style="background:none; border:none; color:#E53E3E; cursor:pointer;" onclick="deleteProject(${p.id})">✕</button>
          </div>
          <div style="background:var(--item-bg); padding:8px; border-radius:8px; border:1.5px solid var(--input-border);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
              <strong style="font-size:0.78rem; color:var(--text-muted); text-transform:uppercase;">Sub-taken:</strong>
              <button class="btn btn-secondary btn-small" style="font-size:0.7rem; padding:2px 6px;" onclick="addProjectSubTask(${p.id})">+ Sub-taak</button>
            </div>
            <div style="display:flex; flex-direction:column; gap:4px;">${subtasksHtml}</div>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function openAllProjectsModal() { document.getElementById('all-projects-modal').classList.remove('hidden'); renderAllProjectsModal(); }
    function closeAllProjectsModal() { document.getElementById('all-projects-modal').classList.add('hidden'); }
    function renderAllProjectsModal() { renderProjects(); }

    // --- RUIMTE-KOMPAS & FAMILIE PROJECTEN LOGICA ---
    function initDefaultRuimteData() {
      if (!localStorage.getItem('voldaan_ruimte_projects')) {
        localStorage.setItem('voldaan_ruimte_projects', JSON.stringify([
          { id: 1, title: "Ouders - Herstel Afspraak 🤝", totalAmount: 600, repaidAmount: 150, monthlyTarget: 50, createdDate: getNowDateTimeStr(), history: [] }
        ]));
      }
    }

    function openRuimteProjectsModal() { 
      document.getElementById('ruimte-projects-modal').classList.remove('hidden'); 
      resetRuimteForm();
      renderRuimteKompas(); 
    }

    function closeRuimteProjectsModal() { 
      document.getElementById('ruimte-projects-modal').classList.add('hidden'); 
    }

    function toggleAddRuimteForm() { 
      const form = document.getElementById('add-ruimte-form');
      if (form.classList.contains('hidden')) {
        resetRuimteForm();
        form.classList.remove('hidden');
      } else {
        form.classList.add('hidden');

    function resetRuimteForm() {
      document.getElementById('ruimte-edit-id').value = '';
      document.getElementById('ruimte-title-input').value = '';
      document.getElementById('ruimte-amount-input').value = '';
      document.getElementById('ruimte-monthly-input').value = '';
      document.getElementById('ruimte-form-title').innerText = 'Nieuw Familie-Project Toevoegen';
    }

    function editRuimteProject(id) {
      let projects = JSON.parse(localStorage.getItem('voldaan_ruimte_projects') || '[]');
      const p = projects.find(item => item.id === id);
      if (!p) return;

      document.getElementById('ruimte-edit-id').value = p.id;
      document.getElementById('ruimte-title-input').value = p.title;
      document.getElementById('ruimte-amount-input').value = p.totalAmount;
      document.getElementById('ruimte-monthly-input').value = p.monthlyTarget || '';
      document.getElementById('ruimte-form-title').innerText = '✏️ Familie-Project Bewerken';

      document.getElementById('add-ruimte-form').classList.remove('hidden');
    }

    function saveRuimteProject() {
      const editId = document.getElementById('ruimte-edit-id').value;
      const title = document.getElementById('ruimte-title-input').value;
      const amount = parseFloat(document.getElementById('ruimte-amount-input').value) || 0;
      const monthly = parseFloat(document.getElementById('ruimte-monthly-input').value) || 0;

      if (!title.trim() || amount <= 0) return;

      let projects = JSON.parse(localStorage.getItem('voldaan_ruimte_projects') || '[]');

      if (editId) {
        const idx = projects.findIndex(p => p.id === parseInt(editId));
        if (idx !== -1) {
          projects[idx].title = title.trim();
          projects[idx].totalAmount = amount;
          projects[idx].monthlyTarget = monthly;
        }
      } else {
        projects.unshift({ id: Date.now(), title: title.trim(), totalAmount: amount, repaidAmount: 0, monthlyTarget: monthly, createdDate: getNowDateTimeStr(), history: [] });
      }

      localStorage.setItem('voldaan_ruimte_projects', JSON.stringify(projects));

      document.getElementById('add-ruimte-form').classList.add('hidden');

    function addRuimteRepayment(id) {
      const inputEl = document.getElementById(`ruimte-pay-input-${id}`);
      const val = parseFloat(inputEl.value);

      if (!val || val <= 0) return;

      let projects = JSON.parse(localStorage.getItem('voldaan_ruimte_projects') || '[]');
      const p = projects.find(item => item.id === id);

      if (p) {
        if (!p.history) p.history = [];
        p.history.unshift({ id: Date.now(), type: 'payment', amount: val, date: getNowDateTimeStr() });
        p.repaidAmount = (p.repaidAmount || 0) + val;

        localStorage.setItem('voldaan_ruimte_projects', JSON.stringify(projects));
        triggerConfetti();
        addMarble(`Aflossing voor ${p.title} (€${val})`, 'Geld & Aflossingen');
        renderRuimteKompas();
        updateStats();
      }
    }

    function renderRuimteKompas() {
      let projects = JSON.parse(localStorage.getItem('voldaan_ruimte_projects') || '[]');
      const container = document.getElementById('ruimte-projects-list');
      if (!container) return;
      container.innerHTML = '';

      let totalOriginal = 0, totalRepaid = 0;
      document.getElementById('ruimte-project-count-badge').innerText = `${projects.length} Projecten`;

      projects.forEach(p => {
        const repaid = p.repaidAmount || 0;
        const total = p.totalAmount || 0;
        totalOriginal += total;
        totalRepaid += repaid;

        const card = document.createElement('div');
        card.className = 'item-card';
        card.style.flexDirection = 'column';
        card.style.alignItems = 'stretch';
        card.style.gap = '8px';

        card.innerHTML = `
          <div style="display:flex; justify-content:space-between; align-items:flex-start;">
            <div>
              <strong>🤝 ${p.title}</strong>
              <div style="font-size:0.78rem; color:var(--text-muted);">Vrijgemaakt: €${repaid} van €${total} ${p.monthlyTarget ? `(Maanddoel: €${p.monthlyTarget})` : ''}</div>
            </div>
            <div style="display:flex; gap:4px;">
              <button class="btn btn-secondary btn-small" style="font-size:0.72rem; padding:2px 6px;" onclick="editRuimteProject(${p.id})">✏️</button>
              <button style="background:none; border:none; color:#E53E3E; cursor:pointer;" onclick="removeRuimteProject(${p.id})">✕</button>
            </div>
          </div>
          <div style="display:flex; gap:6px; align-items:center;">
            <input type="number" id="ruimte-pay-input-${p.id}" placeholder="€" value="${p.monthlyTarget || ''}" style="margin-bottom:0; width:80px; font-size:0.8rem; padding:4px 6px;">
            <button class="btn btn-small" style="font-size:0.75rem; background-color:#38A169;" onclick="addRuimteRepayment(${p.id})">💶 Aflossen</button>
          </div>
        `;
        container.appendChild(card);
      });

      const totalRemaining = Math.max(0, totalOriginal - totalRepaid);
      const totalPct = totalOriginal > 0 ? Math.min(100, Math.round((totalRepaid / totalOriginal) * 100)) : 0;

      document.getElementById('ruimte-total-repaid-text').innerText = `€${totalRepaid}`;
      document.getElementById('ruimte-total-remaining-text').innerText = `€${totalRemaining}`;
      document.getElementById('ruimte-total-original-text').innerText = `€${totalOriginal}`;

      const barEl = document.getElementById('ruimte-total-progress-bar');
      if (barEl) barEl.style.width = `${totalPct}%`;
    }

    function renderStudyDebtDisplay() {
      let debt = JSON.parse(localStorage.getItem('voldaan_study_debt') || 'null');
      const box = document.getElementById('study-debt-display-box');
      if (!box) return;

      if (!debt) {
        box.innerHTML = `<div style="text-align:center; padding:10px; color:var(--text-muted); font-size:0.85rem;">🎓 Geen studieschuld ingesteld. Klik op 'Instellen' om je voortgang bij te houden.</div>`;
        return;
      }

      const remaining = Math.max(0, debt.total - debt.repaid);
      const pct = debt.total > 0 ? Math.min(100, Math.round((debt.repaid / debt.total) * 100)) : 0;
      let mLeftText = debt.monthly > 0 && remaining > 0 
        ? `Nog ca. <strong>${Math.ceil(remaining / debt.monthly)} maanden</strong> (${(remaining / debt.monthly / 12).toFixed(1)} jaar) bij €${debt.monthly}/mnd.`

          <span>Resterend: <strong>€${remaining}</strong></span>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-top:8px;">

      if (!b) return;

    function saveFixedBill() {
      const editId = document.getElementById('bill-edit-id').value;
      const name = document.getElementById('bill-name-input').value.trim();
      const type = document.getElementById('bill-type-select').value;
      const amount = parseFloat(document.getElementById('bill-amount-input').value) || 0;
      const day = parseInt(document.getElementById('bill-day-input').value) || 1;

      if (!name) return;

      let bills = JSON.parse(localStorage.getItem('voldaan_fixed_bills') || '[]');

      if (editId) {
        const idx = bills.findIndex(b => b.id === parseInt(editId));
        if (idx !== -1) {
          bills[idx].name = name;
          bills[idx].type = type;
          bills[idx].amount = amount;
          bills[idx].day = Math.min(31, Math.max(1, day));
        }
      } else {
        bills.push({
          id: Date.now(),
          name,
          type,
          amount,
          day: Math.min(31, Math.max(1, day)),
          paid: false,
          archived: false,
          created: getNowDateTimeStr()
        });
      }

      localStorage.setItem('voldaan_fixed_bills', JSON.stringify(bills));
      document.getElementById('add-bill-form').classList.add('hidden');
      renderMoneyView();
    }

      if (filterAnchor === 'SAVED') filteredAnchors = filteredAnchors.filter(a => a.saved);

          anchorsContainer.appendChild(div);
        });
