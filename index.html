<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Voldaan — Rust & Structuur op Jouw Tempo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #F8F6F0;
      --card-bg: #FFFFFF;
      --text-main: #2D3748;
      --text-muted: #718096;
      --accent-soft: #E2E8F0;
      --accent-primary: #5A67D8;
      --accent-hover: #4C51BF;
      --soft-teal: #E6FFFA;
      --teal-border: #B2F5EA;
      --teal-text: #234E52;
      --soft-warm: #FFFAF0;
      --warm-border: #FEEBC8;
      --warm-text: #7B341E;
      --soft-purple: #FAF5FF;
      --purple-border: #E9D8FD;
      --purple-text: #553C9A;
      --radius: 16px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding-bottom: 40px;
    }

    header {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 10px;
    }

    header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--accent-primary);
      letter-spacing: -0.5px;
    }

    header p {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card h2 {
      font-size: 1.15rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-bottom: 16px;
      line-height: 1.4;
    }

    .btn {
      background-color: var(--accent-primary);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      transition: all 0.2s ease;
    }

    .btn:hover {
      background-color: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background-color: #EDF2F7;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background-color: #E2E8F0;
    }

    .energy-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 12px;
    }

    .energy-btn {
      background: #F7FAFC;
      border: 2px solid #EDF2F7;
      border-radius: 12px;
      padding: 12px;
      font-size: 0.9rem;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
